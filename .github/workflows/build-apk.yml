name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.alqoud --project-name alqoud_tools .

      - name: Add Android notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' + chr(10)
          if "android.permission.POST_NOTIFICATIONS" not in content:
              content = content.replace("<application", permission + "    <application", 1)
              path.write_text(content)
          PY

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALQOUD-TOOLS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ALQOUD TOOLS APK Build ${{ github.run_number }}
          body: |
            Android release APK generated automatically from the main branch.
            This is an initial build; test it on your device before wider distribution.
          files: build/app/outputs/flutter-apk/app-release.apk
